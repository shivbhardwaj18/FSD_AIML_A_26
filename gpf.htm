<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>git-finder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --bg: #060a07;
    --panel: #0d1510;
    --panel-2: #101d15;
    --line: #1c3527;
    --green: #3ef08c;
    --green-dim: #1e6b45;
    --text: #d7f5e3;
    --muted: #5f8871;
    --red: #ff6b6b;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, rgba(62,240,140,0.06), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 28px;
  }

  .window{
    width:100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 0 0 1px rgba(62,240,140,0.03), 0 30px 80px -20px rgba(0,0,0,0.7);
    overflow: hidden;
  }

  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 12px 16px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
  }

  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.r{ background:#ff5f56; }
  .dot.y{ background:#ffbd2e; }
  .dot.g{ background:#27c93f; }

  .titlebar span{
    margin-left: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .body{
    padding: 28px 24px 32px;
  }

  .prompt-line{
    display:flex;
    align-items:center;
    gap:10px;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 18px;
  }

  .prompt-line .sym{ color: var(--green); }

  h1{
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  h1 .cursor{
    display:inline-block;
    width: 9px;
    height: 18px;
    background: var(--green);
    margin-left: 6px;
    vertical-align: -3px;
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink{ 50%{ opacity: 0; } }

  .tagline{
    color: var(--muted);
    font-size: 12.5px;
    margin: 0 0 22px;
  }

  .search{
    display:flex;
    align-items:center;
    background: #050a06;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 4px 4px 14px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  .search:focus-within{
    border-color: var(--green-dim);
    box-shadow: 0 0 0 3px rgba(62,240,140,0.08);
  }

  .search .prefix{ color: var(--green); font-size: 14px; user-select:none; }

  input{
    flex:1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    padding: 12px 8px;
  }

  input::placeholder{ color: #3a5646; }

  button{
    border: none;
    border-radius: 4px;
    background: var(--green);
    color: #06180f;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.03em;
    padding: 11px 16px;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }

  button:hover{ background: #5bffa6; }
  button:active{ transform: scale(0.97); }

  #message{
    margin: 16px 2px 0;
    font-size: 12.5px;
    color: var(--muted);
    min-height: 16px;
  }

  #message.error{ color: var(--red); }
  #message.error::before{ content: "✗ "; }
  #message.loading::before{ content: "› "; color: var(--green); }

  #profile{
    display:none;
    margin-top: 22px;
    border-top: 1px dashed var(--line);
    padding-top: 22px;
    animation: rise .35s ease both;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .profile-head{
    display:flex;
    gap: 16px;
    align-items:center;
  }

  .avatar{
    width: 68px;
    height: 68px;
    border-radius: 8px;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }

  .name{
    font-family: 'Space Mono', monospace;
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    margin: 0;
  }

  .username{
    color: var(--green);
    font-size: 13px;
    margin: 3px 0 0;
  }

  .username::before{ content: "@"; color: var(--muted); }

  .bio{
    color: #a9c9b6;
    font-size: 13px;
    line-height: 1.6;
    margin: 16px 0 0;
    padding-left: 2px;
    border-left: 2px solid var(--green-dim);
    padding-left: 12px;
  }

  .stats{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 20px 0 4px;
  }

  .stat{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 10px;
    text-align: center;
  }

  .stat strong{
    display:block;
    font-family: 'Space Mono', monospace;
    font-size: 19px;
    color: var(--green);
  }

  .stat span{
    display:block;
    margin-top: 4px;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .profile-link{
    display:flex;
    align-items:center;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
    padding: 12px;
    border: 1px solid var(--green-dim);
    border-radius: 6px;
    color: var(--green);
    text-decoration: none;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    transition: background .15s ease, color .15s ease;
  }

  .profile-link:hover{
    background: var(--green);
    color: #06180f;
  }

  @media (max-width: 480px){
    .stats{ grid-template-columns: repeat(3,1fr); gap:8px; }
    .stat strong{ font-size: 16px; }
  }
</style>
</head>
<body>

  <div class="window">
    <div class="titlebar">
      <div class="dot r"></div>
      <div class="dot y"></div>
      <div class="dot g"></div>
      <span>zsh — git-finder</span>
    </div>

    <div class="body">
      <div class="prompt-line"><span class="sym">~/tools</span> <span>git-finder --lookup</span></div>

      <h1>Profile Finder<span class="cursor"></span></h1>
      <p class="tagline">Look up any public GitHub account by username.</p>

      <div class="search">
        <span class="prefix">$</span>
        <input type="text" id="usernameInput" placeholder="octocat">
        <button onclick="getProfile()">RUN</button>
      </div>

      <p id="message"></p>

      <div id="profile">
        <div class="profile-head">
          <img id="avatar" class="avatar" alt="GitHub Avatar">
          <div>
            <h2 class="name" id="name"></h2>
            <p class="username" id="username"></p>
          </div>
        </div>

        <p class="bio" id="bio"></p>

        <div class="stats">
          <div class="stat"><strong id="followers">0</strong><span>Followers</span></div>
          <div class="stat"><strong id="following">0</strong><span>Following</span></div>
          <div class="stat"><strong id="repos">0</strong><span>Repos</span></div>
        </div>

        <a id="profileLink" class="profile-link" target="_blank">View on GitHub →</a>
      </div>
    </div>
  </div>

<script>
  async function getProfile() {
    const username = document.getElementById("usernameInput").value.trim();
    const message = document.getElementById("message");
    const profile = document.getElementById("profile");

    message.className = "";

    if (username === "") {
      message.textContent = "Enter a username to continue.";
      message.className = "error";
      profile.style.display = "none";
      return;
    }

    message.textContent = "fetching " + username + " ...";
    message.className = "loading";

    try {
      const response = await fetch(`https://api.github.com/users/${username}`);

      if (!response.ok) {
        throw new Error("No account found for \"" + username + "\".");
      }

      const data = await response.json();

      document.getElementById("avatar").src = data.avatar_url;
      document.getElementById("name").textContent = data.name || data.login;
      document.getElementById("username").textContent = data.login;
      document.getElementById("bio").textContent = data.bio || "No bio set.";
      document.getElementById("followers").textContent = data.followers;
      document.getElementById("following").textContent = data.following;
      document.getElementById("repos").textContent = data.public_repos;
      document.getElementById("profileLink").href = data.html_url;

      profile.style.display = "block";
      message.textContent = "";
      message.className = "";
    } catch (error) {
      profile.style.display = "none";
      message.textContent = error.message;
      message.className = "error";
    }
  }

  document.getElementById("usernameInput").addEventListener("keypress", function(event) {
    if (event.key === "Enter") getProfile();
  });
  
</script>

</body>
</html>
